<div class="list-column">
  <!-- Title (looks like a button, not clickable) -->
  <div class="list-title">
    {{ listname() }}
  </div>

  <!-- This holds your todo items -->
  <div class="boarder">
    <ng-content></ng-content>
  </div>

  <!-- Add button -->
  <button class="add-btn">+</button>

<!-- Tool Bar -->

 <span class="toolbar-location">
    <button mat-icon-button class= "custom-toolbar-btn"[matMenuTriggerFor]="menu" #menuTrigger="matMenuTrigger" (mouseover)="menuTrigger.openMenu()">
      <mat-icon >menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu" [overlapTrigger]="false">
    <span (mouseleave)="menuTrigger.closeMenu()">
      <button mat-menu-item>
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
  </button>
  <button mat-menu-item>
        <mat-icon>edit</mat-icon>
        <span>Edit</span>
      </button>
  </span>
  </mat-menu>
  </span>
</div>
