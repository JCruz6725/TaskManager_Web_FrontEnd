
<!-- Display all data -->
  <!-- <p>{{userSingleList() | json}} --> <!-- </p> -->

<div class="list-column">

  <!-- Title (looks like a button, not clickable) -->
  <div class="list-title">
    {{ listname() }}
  </div>

  <!-- This holds your todo items -->
  <div class="boarder" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (task of listSize(); track task.id){
      <a routerLink="/taskDetails/{{task.id}}">
        <app-task [taskId] = "task.id" cdkDrag></app-task>
      </a>
    }  
  </div>

  <!-- Add button -->
  <button class="add-btn">+</button>

  <button class="delete-btn">
    <mat-icon>delete</mat-icon>
  </button>
</div>
