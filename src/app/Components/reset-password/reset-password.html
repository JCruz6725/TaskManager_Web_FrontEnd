
<div class="reset-container">
    <h2 class="reset-head">Reset Password</h2>

    <form [formGroup]="resetForm" (ngSubmit)="submitForm()">
        <label for="email" class="text-box-label">Email</label>
        <div>
            <input type="text" name="email" id="email" class="text-box" required formControlName="email"/>
        </div>

        <label for="old-pass" class="text-box-label">Old Password</label>
        <div>
            <input type="text" name="old-pass" id="old-pass" class="text-box"  required formControlName="oldPassword"> 
        </div>

        <label for="new-pass" class="text-box-label">New Password</label>
        <div>
            <input type="text" name="new-pass" id="new-pass" class="text-box" required formControlName="newPassword"> 
        </div>
        
        <button class="reset-btn" matButton="tonal" type="submit" [disabled]="!resetForm.valid">Reset Password</button>
    </form>

    @if (successMessage()) {
        <p style="color: green;">{{successMessage()}}</p>
        <a routerLink="/login">Return to Login</a> 
    }
    @if (errorMessage()) {
        <p style="color: red;"> {{errorMessage()}} </p>
    }
    
</div>
