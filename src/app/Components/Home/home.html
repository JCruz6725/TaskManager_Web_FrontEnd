<p class=center>Home</p>

<button (click)=" getAllList()" class="Success">Load User</button>

<div class="boarder" cdkDropListGroup>
  @for ( list of userList(); track list.id){
  <app-single [dataID]=" list.id" (getAllList)="getAllList()"></app-single>
  }
  <app-list-creation *ngIf="newList" (getAllList)="getAllList()"
    (toggleInputChange)="newList = $event"></app-list-creation>

  <div>

    <button (click)="toggleInput()" class="addList-btn">+</button>
  </div>
